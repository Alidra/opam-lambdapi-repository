on:
  workflow_call:

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          echo 'matrix=[/home/abdelghani/Repos/opam-lambdapi-repository/packages/lambdapi-stdlib/lambdapi-stdlib.1.3.1/]' >> $GITHUB_OUTPUT
  run_library:
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix:
        ocaml-version": [5.0.0]
        libraries: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: checking out opam lambdapi repo
        uses: actions/checkout@v6
      - name: setting up opam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-version }}
      - name: install_library
        run: opam install -y ${{ matrix.libraries }}