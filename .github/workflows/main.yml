on:
  push:

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ocaml_version: [5.4.1]
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          files=$(find packages -type f -name "opam" -exec dirname {} \;)
          json=$(printf '%s' "$files" | jq -R . | jq -s '{include: map({lib: ., ocaml_version: \"${{matrix.ocaml_version}}\"})}')
          {
            echo "matrix<<EOF"
            echo "$json"
            echo "EOF"
          } >> $GITHUB_OUTPUT
  

  install-library:
    needs: generate-matrix
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: setting up opam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml_version }}
      - name: install library ${{ matrix.lib }} 
        run: |
          echo "installing ${{ matrix.lib }}"
          opam install -y "${{ matrix.lib }}"