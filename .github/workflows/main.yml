name: Dynamic Matrix Example

on:
  push:

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}

    steps:
      - id: set
        run: |
          echo 'matrix={"include":[{"library":"packages/lambdapi-stdlib/lambdapi-stdlib.1.3.1"},{"library":"packages/lambdapi-stdlib/lambdapi-stdlib.1.3.0"}]}' >> $GITHUB_OUTPUT

  install-library:
    needs: generate-matrix
    runs-on: ubuntu-latest

    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: checking out lambdapi repo
        uses: actions/checkout@v6
      - name: setting up opam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.3.0

      - name: install-library
        run: |
          opam install -y ${{matrix.library}}
        